name: PR Build

on:
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Build and Test
        run: ./mvnw -B verify
